<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}</style></head><body>
<title>Gear Rush</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap">
<style>
/* Layout: one portrait column. Battle: header, board canvas, action bar. Hall: tabs for campaign, collection, chests. */
:root{color-scheme:dark;--bg:#1d2230;--bg2:#2c3550;--panel:#2a3040;--panel2:#363e54;--line:#4a5470;--fg:#f6f0e2;--mute:#b5bccf;--ink:#1a1d27;--gold:#ffcf3f;--red:#ff5b5b;--green:#5fd06a;--blue:#4a9fe8;--brass:#e0a93a;--paper:#fff6e3;
 --f-d:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;--f-b:"Nunito","Trebuchet MS",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg);height:100%}
body{margin:0;font-family:var(--f-b);font-weight:800;font-size:14px;line-height:1.35;background-image:radial-gradient(circle at 50% 0,var(--bg2),var(--bg) 70%);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font-family:inherit;font-weight:inherit;cursor:pointer;border:0;background:none;padding:0;color:inherit}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.app{position:relative;max-width:440px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-block:8px;user-select:none;-webkit-user-select:none;overflow:hidden}
.hdr{flex:none;display:flex;align-items:center;gap:6px;height:46px}
.hdr .st{flex:1;min-width:0;display:flex;flex-direction:column}
.hdr .st b{font-family:var(--f-d);font-weight:400;font-size:17px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.waves{display:flex;flex-wrap:nowrap;gap:3px;margin-top:4px}.waves i{flex:none}
.waves i{width:20px;height:8px;border-radius:4px;background:#3a4256;border:2px solid var(--ink)}
.waves i.on{background:var(--green)}.waves i.cur{background:var(--gold)}.waves i.bw{width:28px;border-color:#d8303f}
.pill{flex:none;display:flex;align-items:center;gap:5px;height:32px;padding:0 9px;border-radius:16px;background:var(--panel);border:2px solid var(--ink);font-size:14px;font-weight:900;white-space:nowrap}
.coin{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff2a8,#e9a816 70%);border:2px solid var(--ink);flex:none}
.gem{width:13px;height:13px;transform:rotate(45deg);background:linear-gradient(135deg,#bff,#3fb8f0);border:2px solid var(--ink);flex:none;border-radius:2px}
.cog{width:14px;height:14px;border-radius:50%;background:#9aa3b5;border:3px dotted var(--ink);flex:none}
.bolt{width:12px;height:16px;background:var(--gold);clip-path:polygon(60% 0,0 58%,45% 58%,30% 100%,100% 38%,55% 38%);flex:none}
.heart{width:15px;height:13px;background:var(--red);clip-path:path('M7.5 13 C-3 6 1 -2 7.5 3 C14 -2 18 6 7.5 13Z');flex:none}
.ib{flex:none;width:36px;height:36px;border-radius:11px;background:var(--panel2);border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--f-d);font-size:15px}
.field{position:relative;flex:1 1 auto;min-height:260px;border-radius:18px;overflow:hidden;border:3px solid var(--ink);background:#5c8a3a;touch-action:none}
.field canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.boss{position:absolute;left:8px;right:8px;top:6px;pointer-events:none}
.boss[hidden]{display:none}
.boss b{display:block;font-family:var(--f-d);font-weight:400;font-size:14px;text-shadow:0 2px 0 var(--ink)}
.boss .bb{height:11px;border-radius:6px;background:rgba(26,29,39,.7);border:2px solid var(--ink);overflow:hidden}
.boss .bb i{display:block;height:100%;background:linear-gradient(#ff8a8a,#d8303f);transition:width .15s}
.boss .bc{display:inline-block;margin-top:3px;font-size:11.5px;font-weight:900;background:rgba(26,29,39,.85);border-radius:7px;padding:1px 7px;color:#ffb3b3}
.toast{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);width:max-content;max-width:calc(100% - 24px);text-align:center;font-size:13px;font-weight:900;background:rgba(26,29,39,.9);border:2px solid var(--ink);border-radius:12px;padding:5px 11px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.bar{flex:none;display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:8px;margin-top:8px;align-items:stretch}
.act{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border-radius:15px;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);padding:6px 4px;min-height:62px}
.act:active{transform:translateY(2px);box-shadow:0 2px 0 var(--ink)}
.act b{font-family:var(--f-d);font-weight:400;font-size:18px;line-height:1}
.act span{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:900}
.act small{font-size:10.5px;color:inherit;opacity:.8}
#sumB{background:linear-gradient(#ffd75a,#e9a816);color:var(--ink)}
#sumB b{font-size:23px}
#boostB{background:#e9eef7;color:var(--ink)}
#autoB{background:var(--panel2);color:var(--mute)}
#autoB.on{background:var(--green);color:var(--ink)}
.act:disabled{background:#4a5266;color:#9aa2b5;box-shadow:0 2px 0 var(--ink)}
.hint{flex:none;min-height:36px;margin-top:6px;font-size:12.5px;line-height:1.3;color:var(--mute)}
.hint b{color:var(--fg)}
.ov{position:absolute;inset:0;z-index:40;background:rgba(12,14,20,.74);display:flex;flex-direction:column;align-items:center;padding:12px;overflow-y:auto;overscroll-behavior:contain}
.ov::before,.ov::after{content:"";flex:1 0 0}
.ov[hidden]{display:none}
.ov.solid{background:linear-gradient(#2c3550,#1d2230)}
.card{flex:none;width:100%;max-width:370px;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:20px;padding:14px;box-shadow:0 7px 0 var(--ink);display:flex;flex-direction:column;gap:9px;text-align:center}
.card h2{margin:0;font-family:var(--f-d);font-weight:400;font-size:26px;line-height:1.05}
.card p{margin:0;font-size:13.5px;color:#5f6070}
.card p b{color:var(--ink)}
.card .row{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.btn{font-family:var(--f-d);font-size:17px;border-radius:13px;border:3px solid var(--ink);padding:8px 14px;box-shadow:0 4px 0 var(--ink);background:var(--gold);color:var(--ink)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--ink)}
.btn.big{font-size:21px;padding:11px 16px}
.btn.dark{background:#e3e6ee}.btn.green{background:var(--green)}
.btn.sm{font-size:14px;padding:5px 10px;border-width:2px;box-shadow:0 3px 0 var(--ink)}
.btn:disabled{background:#8a8f9c;color:#d5d8e0;box-shadow:none;cursor:default}
.ad{display:inline-block;font-family:var(--f-b);font-size:10px;font-weight:900;background:var(--ink);color:#fff;border-radius:5px;padding:1px 4px;margin-left:5px;vertical-align:2px}
.rw{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.rw span{display:flex;align-items:center;gap:4px;background:#efe6d2;border-radius:10px;padding:3px 8px;font-size:13px}
.stars{font-family:var(--f-d);font-size:30px;letter-spacing:4px;color:#d5cfc0}.stars i{font-style:normal;color:var(--brass)}
.info{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;text-align:left;font-size:13px;background:#f1ead8;border-radius:12px;padding:8px 10px}
.info span{color:#7a7468}.info b{color:var(--ink)}
.enemies{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.enemies .ic{width:40px;height:40px;border-radius:10px;background:#e9e2d0;border:2px solid var(--ink)}
.slots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.slot{position:relative;width:62px;height:72px;border-radius:12px;border:2.5px solid var(--ink);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:11px;color:var(--ink)}
.slot.sel{box-shadow:0 0 0 3px var(--brass)}
.slot.empty{border-style:dashed;background:#f1ead8;color:#7a7468}
.slot.lock{opacity:.45}
.slot small{font-size:9.5px;color:#7a7468;font-weight:900}
.pickl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.pickl .slot{width:auto}
.hall{flex:none;width:100%;max-width:420px;display:flex;flex-direction:column;gap:9px}
.hall h1{margin:2px 0 0;font-family:var(--f-d);font-weight:400;font-size:38px;line-height:1;color:var(--gold);text-shadow:0 4px 0 var(--ink);text-align:center}
.cmdr{display:flex;align-items:center;gap:8px;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:6px 10px}
.cmdr .lv{width:38px;height:38px;border-radius:50%;background:var(--brass);color:var(--ink);border:3px solid var(--ink);display:grid;place-items:center;font-family:var(--f-d);font-size:18px;flex:none}
.cmdr .xb{flex:1;min-width:0}
.cmdr .xb span{font-size:11.5px;color:var(--mute)}
.prog{height:8px;border-radius:4px;background:#161921;overflow:hidden;margin-top:3px;border:1.5px solid var(--ink)}.prog i{display:block;height:100%;background:var(--blue)}
.bank{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tab{position:relative;font-family:var(--f-d);font-size:15px;padding:7px 0;border-radius:11px;background:var(--panel);border:2px solid var(--ink);color:var(--mute)}
.tab.on{background:var(--gold);color:var(--ink)}
.tab .dot{position:absolute;top:-5px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-family:var(--f-b);display:grid;place-items:center;border:2px solid var(--ink)}
.chap{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:8px 10px}
.chap h3{margin:0 0 6px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:900;display:flex;justify-content:space-between}
.nodes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
.node{position:relative;height:46px;border-radius:11px;background:var(--panel2);border:2px solid var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--f-d);font-size:16px;line-height:1}
.node small{font-family:var(--f-b);font-size:9px;font-weight:900;color:var(--brass);letter-spacing:1px}
.node.done{background:#3f6a3c}
.node.next{background:var(--gold);color:var(--ink);animation:pulse .8s infinite alternate}
.node.lock{opacity:.4}
.node.bossn{border-color:#d8303f;border-width:3px}
.node.mile::after{content:"";position:absolute;top:-5px;right:-4px;width:12px;height:12px;border-radius:50%;background:#7fdcf5;border:2px solid var(--ink)}
@keyframes pulse{to{transform:scale(1.06)}}
.wlist{display:flex;flex-direction:column;gap:7px}
.wc{display:flex;gap:9px;align-items:center;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:7px 9px}
.wc.lock{opacity:.55}
.wc .ic{flex:none;width:50px;height:50px}
.wc .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.wc .tx b{font-size:14.5px}.wc .tx span{font-size:11.5px;color:var(--mute);line-height:1.25}
.wc .tx em{font-style:normal;font-size:10.5px;font-weight:900;color:var(--brass);text-transform:uppercase;letter-spacing:.05em}
.sec{margin:6px 0 0;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:900}
.go{position:sticky;bottom:-12px;padding:10px 0 12px;background:linear-gradient(rgba(29,34,48,0),#1d2230 45%);display:flex}
.go .btn{flex:1}
.note{margin:0;font-size:12px;color:var(--mute)}
.rates{width:100%;font-size:12px;border-collapse:collapse;color:var(--mute)}.rates td{padding:2px 4px;border-bottom:1px solid var(--line)}.rates td:last-child{text-align:right;color:var(--fg)}
@media (prefers-reduced-motion:reduce){.node.next{animation:none}}
</style>

<div class="app" id="app">
  <div class="hdr" id="hdr">
    <div class="st"><b id="stN">Level 1</b><div class="waves" id="waves"></div></div>
    <div class="pill"><i class="heart"></i><span id="lives">10</span></div>
    <div class="pill"><i class="bolt"></i><span id="energy">0</span></div>
    <button class="ib" id="pauseB" aria-label="Pause">II</button>
  </div>
  <div class="field" id="field">
    <canvas id="cv" aria-label="Board. Drag a gear onto the same gear to merge it, or onto an empty cell to move it. Tap a jammed gear to free it."></canvas>
    <div class="boss" id="boss" hidden><b id="bossN"></b><div class="bb"><i id="bossF"></i></div><span class="bc" id="bossC" hidden></span></div>
    <div class="toast" id="toast" role="status"></div>
  </div>
  <div class="bar" id="bar">
    <button class="act" id="boostB"><b>Core</b><span id="boostC"></span><small id="boostL"></small></button>
    <button class="act" id="sumB"><b>Build Gear</b><span><i class="bolt"></i><span id="sumC">10</span></span></button>
    <button class="act" id="autoB" aria-pressed="false"><b>Auto</b><small>plays for you</small></button>
  </div>
  <div class="hint" id="hint"></div>
  <div class="ov" id="ov" hidden></div>
</div>

<script>
/* ===== Gear Rush: pure rules (no DOM) ===== */
var CS=52,COLS=5,ROWS=5,BX=50,BY=96,FW=360,FH=430,RANGE=128,MAXL=5;
var LANE=BY+ROWS*CS+26;
var PATH=[[25,-30],[25,LANE],[335,LANE],[335,40]];
var TW={
 fire:{n:'Fire Gear',col:'#ff7a3a',cd:.95,dmg:7,prop:'Area damage',d:'Shells that burst on a small area'},
 water:{n:'Water Gear',col:'#3ea0ff',cd:.8,dmg:4,prop:'Soak',d:'Soaks enemies and pushes them back. Lightning chains further through soaked enemies'},
 storm:{n:'Lightning Gear',col:'#f2c81a',cd:1.3,dmg:8,prop:'Chain',d:'Lightning that jumps between enemies'},
 poison:{n:'Poison Gear',col:'#9b5de5',cd:1.1,dmg:2,prop:'Damage over time',d:'Toxin that keeps hurting, stacks up'},
 ice:{n:'Ice Gear',col:'#7fdcf5',cd:1.0,dmg:4,prop:'Slow',d:'Shards that slow enemies'},
 earth:{n:'Earth Gear',col:'#a8763e',cd:1.8,dmg:17,prop:'Armor piercing',d:'Slow, heavy rocks that ignore armor'}
};
var SP={
 belt:{n:'Belt',col:'#8a6a4a',d:'Carries power with no speed loss. The only part that fits in a gap'},
 small:{n:'Small Cog',col:'#c8ced8',d:'Neighbour gears attack 80% faster with weaker shots'},
 large:{n:'Large Cog',col:'#6f7888',d:'Neighbour gears hit 2.4x harder, slower, and pierce armor'},
 brake:{n:'Brake',col:'#d9534f',d:'Stores charge, then neighbour gears fire a burst every 6s'}
};
var TOWERS=['fire','water','earth','storm','poison','ice'],SPECS=['belt','small','large','brake'];
var EN={
 swarm:{n:'Swarm Mite',hp:9,spd:52,r:8,en:1},
 grunt:{n:'Gremlin',hp:28,spd:38,r:11,en:2},
 runner:{n:'Runner',hp:16,spd:84,r:9,en:2},
 armor:{n:'Armored Beetle',hp:42,spd:30,r:13,en:3,armor:4},
 rust:{n:'Rust Spreader',hp:34,spd:34,r:12,en:3,rust:1}
};
var BOSS={
 rustking:{n:'Rust King',hp:600,spd:24,r:20,armor:3,rustAll:1,tip:'Rusts every gear near the road. Merge to keep up.'},
 boar:{n:'Iron Boar',hp:1000,spd:26,r:24,armor:8,jam:1,charge:1,tip:'Jams a gear now and then. Tap a jammed gear to free it.'},
 wyrm:{n:'Frost Wyrm',hp:1100,spd:22,r:24,jam:2,tip:'Jams two gears at once. Tap them free fast.'},
 golem:{n:'Magma Golem',hp:1200,spd:18,r:26,armor:10,jam:3,split:1,tip:'Heavy armor, splits into runners. Earth and Large Cogs help.'}
};
var CHAP=[{n:'Forest',boss:'boar'},{n:'Snow Peaks',boss:'wyrm'},{n:'Volcano',boss:'golem'}];
var NLEV=60;
var MILE={3:['storm'],6:['small'],10:['poison'],14:['large'],20:['ice','belt'],30:['brake']};
var CORES={basic:{n:'Brass Core',d:'Powers the 4 gears beside it',cost:0},star:{n:'Star Core',d:'Also powers the 4 diagonal gears',cost:900,cmd:5},reactor:{n:'Reactor Core',d:'Star links and +20% spin',cost:4000,cmd:10}};
var CMD_UNL={2:'Chests',3:'Special slot',4:'Workbench',5:'Star Core',6:'4th tower slot',8:'2nd special slot',10:'Reactor Core'};

function levelInfo(n){var ch=Math.min(2,Math.floor((n-1)/20)),loc=(n-1)%20+1,boss=loc===20?CHAP[ch].boss:loc===10?'rustking':null,
 pool=['swarm','grunt'];if(n>=4)pool.push('runner');if(n>=7)pool.push('armor');if(n>=13)pool.push('rust');
 var feat=ch===0?(loc<=4?'Small board around the core':loc<=9?'Three-row board':'Open field'):ch===1?'Rocks and gaps: bridge them with Belts':'Islands of lava: only Belts cross the gaps';
 var threat=boss?BOSS[boss].n:pool.indexOf('rust')>=0&&n%3===0?'Rust Spreaders':pool.indexOf('armor')>=0&&n%2===0?'Armored Beetles':n%3===1&&n>=4?'Runners':'Swarms';
 var rec={Swarms:'Area damage',Runners:'Slow','Armored Beetles':'Armor piercing','Rust Spreaders':'Fast merges and Belts'}[threat]||'Armor piercing';
 return {n:n,ch:ch,loc:loc,boss:boss,pool:pool,waves:boss?6:5,feat:feat,threat:threat,rec:rec};}

function newMeta(){var it={};TOWERS.concat(SPECS).forEach(function(t){it[t]={own:0,lvl:1,cards:0};});['fire','water','earth'].forEach(function(t){it[t].own=1;});
 return {coins:0,gems:0,cogs:0,scrap:0,xp:0,cmd:1,cleared:0,items:it,load:['fire','water','earth'],spec:[],core:'basic',cores:{basic:1},coreLvl:0,chests:[],runs:0,stars:{}};}
function cmdNeed(l){return Math.round(40*Math.pow(1.28,l-1));}
function towerSlots(m){return m.cmd>=6?4:3;}
function specSlots(m){return m.cmd>=8?2:m.cmd>=3?1:0;}
function cardNeed(l){return Math.round(2*Math.pow(1.3,l-1));}
function cardCoins(l){return Math.round(40*Math.pow(1.42,l-1));}
function coreCost(l){return Math.round(80*Math.pow(1.5,l));}
var ITEM_MAX=20;

var GROW=+(typeof process!=='undefined'&&process.env&&process.env.GROW||1.065);
var S=null;
function rnd(){S.seed=(S.seed+0x6D2B79F5)|0;var t=Math.imul(S.seed^(S.seed>>>15),1|S.seed);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;}
function rr(a,b){return a+rnd()*(b-a);}
function pick(a){return a[(rnd()*a.length)|0];}
function hyp(x,y){return Math.sqrt(x*x+y*y);}
function ev(o){if(S.ev.length<400)S.ev.push(o);}
function cx(c){return BX+c*CS+CS/2;}function cy(r){return BY+r*CS+CS/2;}

function makeBoard(L){var g=[],r,c,core=[2,2];for(r=0;r<ROWS;r++){g.push([]);for(c=0;c<COLS;c++)g[r].push({k:'open',g:null});}
 g[2][2].k='core';
 if(L.ch===0){if(L.loc<=4){for(r=0;r<ROWS;r++)for(c=0;c<COLS;c++)if(Math.abs(r-2)>1||Math.abs(c-2)>1)g[r][c].k='rock';}else if(L.loc<=9){for(c=0;c<COLS;c++){g[0][c].k='rock';g[4][c].k='rock';}}}
 else if(L.ch===1){var spots=[[0,0],[0,4],[4,0],[4,4],[1,1],[3,3],[1,3],[3,1],[0,2],[4,2],[2,0],[2,4]],k=0,shuf=spots.slice();for(var i=shuf.length-1;i>0;i--){var j=(rnd()*(i+1))|0,t=shuf[i];shuf[i]=shuf[j];shuf[j]=t;}
  shuf.slice(0,3).forEach(function(p){g[p[0]][p[1]].k='rock';});shuf.slice(3,6).forEach(function(p){g[p[0]][p[1]].k='gap';});}
 else{var a=L.loc%2?1:3;for(r=0;r<ROWS;r++){g[r][a].k='gap';}if(L.loc%3===0)for(c=0;c<COLS;c++)if(g[0][c].k==='open')g[0][c].k='gap';g[2][a].k='gap';}
 return g;}

function newRun(meta,n,seed){var L=levelInfo(n);
 S={seed:seed>>>0,meta:meta,L:L,n:n,t:0,ev:[],en:[],pr:[],fx:[],idSeq:1,lives:10,energy:100,summons:0,boost:0,wave:0,phase:'pre',pt:2.5,sq:[],wt:0,kills:0,result:null,merges:0,unjams:0,revived:0,
