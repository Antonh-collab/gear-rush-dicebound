<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}</style></head><body><title>Grim Dice</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#14111c; --bg-2:#0b0910; --panel:#221d2e; --panel-2:#2c2540; --edge:#3d3456; --text:#f1e9d8; --muted:#a99cba;
  --chips:#3f8cff; --chips-d:#1d4fa8; --mult:#ff4d5e; --mult-d:#a51d2c; --gold:#f2c14e; --soul:#8fe3ff; --ok:#5fcf74; --bone:#efe6d2;
  --r1:#a99cba; --r2:#4f9dff; --r3:#f2a64e;
  --title:"Cinzel",Georgia,serif; --font:"Nunito",ui-rounded,system-ui,sans-serif;
}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:radial-gradient(120% 60% at 50% 0%,#2a2140,var(--bg) 55%,var(--bg-2));background-color:var(--bg);color:var(--text);font-family:var(--font);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit;padding:0}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:440px;margin:0 auto;padding-block:6px 14px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:7px}
.top{display:flex;align-items:center;gap:6px}
.top .t{flex:1;min-width:0;font-family:var(--title);font-weight:900;font-size:18px;line-height:1.05}
.top .t small{display:block;font-family:var(--font);font-weight:700;font-size:12px;color:var(--muted);margin-top:2px}
.pill{display:flex;align-items:center;gap:4px;background:var(--panel);border:2px solid var(--edge);border-radius:999px;padding:2px 8px;font-weight:800;font-size:13px;white-space:nowrap}
.pill i{width:12px;height:12px;border-radius:50%;display:block;background:radial-gradient(circle at 35% 35%,#ffe9a0,#d99a17 70%)}
.pill i.s{background:radial-gradient(circle at 35% 35%,#e6fbff,#3fb8e6 70%)}
.pill i.h{border-radius:3px;background:#ff5d6c}
.hb{background:var(--panel-2);border:2px solid var(--edge);border-radius:10px;padding:4px 9px;font-weight:800;font-size:13px}
h1{font-family:var(--title);font-weight:900;font-size:38px;margin:4px 0 0;text-align:center;letter-spacing:1px;line-height:1}
.sub{text-align:center;color:var(--muted);font-size:14px;margin:0}
.sec{font-family:var(--title);font-weight:900;font-size:16px;margin:6px 0 0;color:var(--bone)}
.panel{background:var(--panel);border:2px solid var(--edge);border-radius:14px;padding:8px}
.btn{border-radius:14px;font-weight:900;font-size:18px;padding:11px 10px;color:#fff;border:2px solid rgba(0,0,0,.35);box-shadow:inset 0 -4px 0 rgba(0,0,0,.25),0 3px 0 rgba(0,0,0,.5)}
.btn.blue{background:linear-gradient(#4f8fff,#2557b8)}.btn.red{background:linear-gradient(#ff5d6c,#b4202f)}.btn.green{background:linear-gradient(#6fdc83,#2f8f45)}.btn.gold{background:linear-gradient(#ffd56a,#c8901a);color:#2a1d00}.btn.soft{background:var(--panel-2)}
.btn.sm{font-size:14px;padding:6px 10px;border-radius:10px}
.btn[disabled]{filter:grayscale(.8) brightness(.7);cursor:default}
/* keep */
.heroes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.hero{background:var(--panel-2);border:2px solid var(--edge);border-radius:12px;padding:6px;text-align:center;font-size:12px;color:var(--muted);line-height:1.2}
.hero canvas{width:64px;height:64px;display:block;margin:0 auto}
.hero b{display:block;color:var(--text);font-size:14px}
.hero.on{border-color:var(--gold);background:#3a3050}
.hero.lock{opacity:.75}
.rows{display:grid;gap:6px}
.row{display:flex;align-items:center;gap:8px;background:var(--panel-2);border:2px solid var(--edge);border-radius:12px;padding:6px 8px}
.row .tx{flex:1;min-width:0;font-size:12.5px;color:var(--muted);line-height:1.2}
.row .tx b{display:block;color:var(--text);font-size:14px}
.row svg{width:30px;height:30px;flex:none}
.relics{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.relic{aspect-ratio:1;border-radius:10px;background:var(--panel-2);border:2px solid var(--edge);display:grid;place-items:center;position:relative}
.relic svg{width:66%;height:66%}
.relic.lock svg{filter:grayscale(1) brightness(.35)}
.relic .c{position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:900;color:var(--soul);background:var(--bg);border-radius:6px;padding:0 3px;white-space:nowrap}
/* map */
.mapbox{position:relative;background:linear-gradient(#1c1728,#241d33);border:2px solid var(--edge);border-radius:16px;overflow:hidden}
.mapbox svg.lines{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:#2c2540;border:3px solid #4a4066;display:grid;place-items:center}
.node svg{width:26px;height:26px}
.node.boss{width:62px;height:62px;margin:-31px 0 0 -31px;border-color:#a5304a;background:#3a1d2a}
.node.boss svg{width:36px;height:36px}
.node.avail{border-color:var(--gold);box-shadow:0 0 0 4px rgba(242,193,78,.25);animation:glow 1s infinite alternate;cursor:pointer}
@keyframes glow{to{box-shadow:0 0 0 7px rgba(242,193,78,.12)}}
.node.done{opacity:.45}
.node.here{border-color:var(--soul);box-shadow:0 0 0 4px rgba(143,227,255,.3)}
.node.off{opacity:.55}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11.5px;color:var(--muted);justify-content:center}
.legend span{display:flex;align-items:center;gap:3px}.legend svg{width:16px;height:16px}
.bag{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.bag .die{width:28px;height:28px;border-radius:7px;border-width:2px;box-shadow:none}
/* battle */
.stage{position:relative;border-radius:14px;overflow:hidden;border:2px solid var(--edge)}
.stage canvas{display:block;width:100%;height:auto;max-width:100%}
.bar{position:absolute;top:7px;width:40%;display:flex;flex-direction:column;gap:2px}
.bar.l{left:8px}.bar.r{right:8px;align-items:flex-end}
.bar .nm{font-weight:800;font-size:12px;text-shadow:0 1px 2px #000}
.hp{position:relative;width:100%;height:16px;border-radius:8px;background:rgba(0,0,0,.55);overflow:hidden;border:2px solid rgba(0,0,0,.6)}
.hp i{position:absolute;left:0;top:0;bottom:0;transition:width .4s}
.hp b{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:900;text-shadow:0 1px 2px #000}
.chipsrow{display:flex;gap:4px;min-height:18px;flex-wrap:wrap}
.chip{font-size:11px;font-weight:800;border-radius:7px;padding:0 6px;color:#fff}
.chip.blk{background:#5a6a86}.chip.psn{background:#3d8a3a}.chip.arm{background:#5a6a86}.chip.stn{background:#c7a12a;color:#2a1d00}
.intent{position:absolute;right:10px;top:54px;background:#f1e9d8;color:#221d2e;border:3px solid var(--mult);border-radius:12px;padding:3px 9px;font-size:13px;font-weight:800;line-height:1.15;max-width:48%}
.intent small{display:block;font-size:10px;color:#6a5f7a;font-weight:700}
.intent b{color:var(--mult-d);font-size:16px}
.intent.armor,.intent.heal{border-color:#7f8fb0}.intent.armor b,.intent.heal b{color:#3b4a6a}
.intent.charge{border-color:#ff8a2a}.intent.curse,.intent.drain{border-color:#9b5de5}.intent.curse b,.intent.drain b{color:#6a2fb8}
.banner{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%) scale(.7);font-family:var(--title);font-weight:900;font-size:24px;color:#fff;text-shadow:0 3px 0 #000,0 0 14px rgba(0,0,0,.6);opacity:0;transition:.18s;white-space:nowrap;pointer-events:none;text-align:center}
.banner.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.score{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;background:var(--panel);border:2px solid var(--edge);border-radius:14px;padding:6px 8px}
.score .hand{grid-column:1/4;display:flex;justify-content:space-between;align-items:baseline;font-weight:900;font-size:16px}
.score .hand span:last-child{font-size:12px;color:var(--muted);font-weight:700}
.box{border-radius:10px;padding:4px 8px;text-align:center;font-weight:900;font-size:25px;line-height:1.05;transition:transform .12s;font-variant-numeric:tabular-nums}
.box small{display:block;font-size:10px;letter-spacing:.08em;font-weight:800;opacity:.85}
.box.c{background:linear-gradient(var(--chips),var(--chips-d))}.box.m{background:linear-gradient(var(--mult),var(--mult-d))}
.box.pop{transform:scale(1.15)}
.x{font-weight:900;font-size:22px;color:var(--muted)}
.dmg{grid-column:1/4;display:flex;justify-content:center;align-items:baseline;gap:8px;font-weight:900;font-size:15px;color:var(--muted)}
.dmg b{font-size:24px;color:var(--gold);font-variant-numeric:tabular-nums}
.items{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.item{position:relative;aspect-ratio:1;max-width:100%;border-radius:11px;background:var(--panel-2);border:2px solid var(--edge);display:grid;place-items:center;transition:transform .12s}
.item.r2{border-color:#3a5f9a}.item.r3{border-color:#9a6a2a}
.item svg{width:64%;height:64%}
.item .fz{display:flex;width:86%;height:70%}.item .fz svg{width:50%;height:100%}
.item.fused{border-color:#b05ad8;background:#34224a}
.item.empty{border-style:dashed;opacity:.4}
.item.fire{animation:fire .5s}
@keyframes fire{40%{transform:scale(1.18) rotate(-4deg);border-color:var(--gold);box-shadow:0 0 16px rgba(242,193,78,.8)}}
.item .note{position:absolute;left:50%;top:-6px;transform:translate(-50%,-100%);white-space:nowrap;font-weight:900;font-size:12px;padding:1px 5px;border-radius:7px;pointer-events:none;animation:up .9s forwards;color:#fff;z-index:3}
@keyframes up{to{transform:translate(-50%,-180%);opacity:0}}
.dice{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding-top:4px}
.die{position:relative;aspect-ratio:1;max-width:100%;border-radius:14px;border:3px solid rgba(0,0,0,.45);box-shadow:0 4px 0 rgba(0,0,0,.5);transition:transform .12s}
.die i{position:absolute;width:15%;height:15%;border-radius:50%;background:#2a2033;transform:translate(-50%,-50%)}
.die.bone{background:var(--bone)}.die.venom{background:#8fd77a}.die.life{background:#f4a0b4}.die.gilt{background:#f2c14e}.die.iron{background:#aebcd2}.die.ember{background:#ff9a5a}.die.storm{background:#b9a3ff}
.die.lock{transform:translateY(-6px);box-shadow:0 4px 0 rgba(0,0,0,.5),0 0 0 3px var(--gold)}
.die.lock::after{content:"LOCK";position:absolute;bottom:-17px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:900;color:var(--gold)}
.die.cursed{box-shadow:0 4px 0 rgba(0,0,0,.5),0 0 0 3px #9b5de5}
.die.cursed::after{content:"CURSED";position:absolute;bottom:-17px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:900;color:#c9a6ff}
.die.scoring{box-shadow:0 4px 0 rgba(0,0,0,.5),0 0 0 3px rgba(255,255,255,.55)}
.die.lock.scoring{box-shadow:0 4px 0 rgba(0,0,0,.5),0 0 0 3px var(--gold),0 0 10px rgba(255,255,255,.5)}
.die.spin{animation:spin .1s infinite}
@keyframes spin{50%{transform:rotate(14deg) scale(.9)}}
.die.hit{animation:hit .35s}
@keyframes hit{40%{transform:translateY(-14px) scale(1.12)}}
.die .tg{position:absolute;top:2px;right:4px;font-size:8px;font-weight:900;color:rgba(0,0,0,.55)}
.die .fl{position:absolute;left:50%;top:-4px;transform:translate(-50%,-100%);font-weight:900;font-size:15px;color:#fff;text-shadow:0 2px 0 #000;animation:up .8s forwards;white-space:nowrap;z-index:3}
.ctrl{display:grid;grid-template-columns:1fr 1.4fr;gap:8px;margin-top:12px}
.info{min-height:38px;background:var(--panel);border:2px solid var(--edge);border-radius:12px;padding:5px 10px;font-size:13.5px;line-height:1.3;display:flex;align-items:center}
.info b{color:var(--gold)}
/* overlays */
#toast{position:fixed;left:50%;top:12%;transform:translate(-50%,-8px);background:var(--bone);color:#221d2e;border-radius:12px;padding:7px 14px;font-weight:800;opacity:0;transition:.2s;pointer-events:none;z-index:45;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.ov{position:fixed;inset:0;background:rgba(5,3,10,.74);display:grid;place-items:center;padding:12px;z-index:30}
.ov[hidden]{display:none}
.card{width:100%;max-width:400px;max-height:94vh;overflow:auto;background:var(--panel);border:2px solid var(--edge);border-radius:18px;padding:14px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.card h2{font-family:var(--title);font-weight:900;margin:0 0 6px;font-size:24px;line-height:1.1}
.card p{margin:0 0 10px;font-size:14.5px;line-height:1.35;color:var(--muted)}
.card p b{color:var(--text)}
table{width:100%;border-collapse:collapse;font-size:13.5px;margin:6px 0 10px}
td{padding:4px 5px;border-bottom:1px solid var(--edge);text-align:left}
td.n{text-align:right;font-variant-numeric:tabular-nums;font-weight:900;white-space:nowrap}
td .c{color:#8db8ff}td .m{color:#ff8f9a}
tr.cur td{background:rgba(242,193,78,.15)}
.opts{display:grid;gap:7px;margin:8px 0}
.opt{display:flex;gap:10px;align-items:center;text-align:left;background:var(--panel-2);border:2px solid var(--edge);border-radius:13px;padding:7px 9px;width:100%}
.opt.sel{border-color:var(--gold);background:#3a3050}
.opt[disabled]{opacity:.45;cursor:default}
.opt svg{width:38px;height:38px;flex:none}
.opt .tx{flex:1;min-width:0;font-size:13px;line-height:1.25;color:var(--muted)}
.opt .tx b{display:block;font-size:15px;color:var(--text)}
.opt .pr{font-weight:900;color:var(--gold);white-space:nowrap}
.opt .mini{width:34px;height:34px;border-radius:9px;flex:none;border-width:2px;box-shadow:none}
.rar{font-size:10px;font-weight:900;border-radius:6px;padding:0 5px;margin-left:5px;vertical-align:2px}
.rar.r1{background:#4a4066;color:#d9d0e8}.rar.r2{background:#24467a;color:#cfe2ff}.rar.r3{background:#7a4a14;color:#ffe2b8}
.btns{display:grid;gap:8px;margin-top:8px}.btns.two{grid-template-columns:1fr 1fr}
.how{display:grid;gap:7px;text-align:left;margin:8px 0}
.how div{display:flex;gap:9px;align-items:center;background:var(--panel-2);border-radius:12px;padding:7px 9px;font-size:13.5px;line-height:1.3}
.how .n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--gold);color:#2a1d00;display:grid;place-items:center;font-weight:900}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<section class="wrap" id="keep" hidden>
  <h1>Grim Dice</h1><p class="sub">A dice-hand roguelite prototype</p>
  <div class="top" style="justify-content:center"><div class="pill"><i class="s"></i><span id="kSouls">0</span> souls</div><button class="hb" id="howBtn">How to play</button></div>
  <div class="sec">Heroes</div><div class="heroes" id="heroes"></div>
  <div class="sec">Skills</div><div class="rows" id="skills"></div>
  <div class="sec">Reliquary <span style="font-family:var(--font);font-size:12px;color:var(--muted)">unlock items for future runs</span></div><div class="relics" id="relics"></div>
  <button class="btn green" id="runBtn" style="font-size:21px;margin-top:6px">Descend</button>
  <p class="sub" id="kStats"></p>
</section>

<section class="wrap" id="map" hidden>
  <div class="top"><div class="t" id="mTitle">Act 1<small>The Lower Town</small></div><div class="pill"><i class="h"></i><span id="mHp"></span></div><div class="pill"><i></i><span id="mGold"></span></div><div class="pill"><i class="s"></i><span id="mSouls"></span></div></div>
  <div class="mapbox" id="mapbox" style="height:470px"></div>
  <div class="legend" id="legend"></div>
  <div class="items" id="mItems"></div>
  <div class="panel bag" id="mBag"></div>
  <div class="btns two"><button class="btn soft sm" id="mHands">Hands</button><button class="btn soft sm" id="mGive">Give up</button></div>
</section>

<section class="wrap" id="battle" hidden>
  <div class="top"><div class="t" id="bTitle"></div><div class="pill"><i></i><span id="bGold">0</span></div><button class="hb" id="handsBtn">Hands</button></div>
  <div class="stage"><canvas id="c" width="480" height="230"></canvas>
    <div class="bar l"><span class="nm" id="hName">You</span><div class="hp"><i id="hHp" style="background:linear-gradient(#6fdc83,#2f8f45)"></i><b id="hHpT"></b></div><div class="chipsrow" id="hChips"></div></div>
    <div class="bar r"><span class="nm" id="eName"></span><div class="hp"><i id="eHp" style="background:linear-gradient(#ff5d6c,#a51d2c)"></i><b id="eHpT"></b></div><div class="chipsrow" id="eChips"></div></div>
    <div class="intent" id="intent"></div><div class="banner" id="banner"></div>
  </div>
  <div class="score"><div class="hand"><span id="handName">-</span><span id="handHint">best hand</span></div>
    <div class="box c" id="chips"><small>CHIPS</small><span>0</span></div><div class="x">&#215;</div><div class="box m" id="mult"><small>MULT</small><span>0</span></div>
    <div class="dmg">Damage <b id="dmg">0</b></div></div>
  <div class="items" id="items"></div>
  <div class="dice" id="dice"></div>
  <div class="ctrl"><button class="btn blue" id="rerollBtn">Reroll</button><button class="btn red" id="atkBtn">Attack</button></div>
  <div class="info" id="info"></div>
</section>
<div id="toast" role="status"></div>
<div class="ov" id="ov" hidden><div class="card" id="card"></div></div>

<script>
/* Dice-hand roguelite rules: 5 dice, lock and reroll, best hand scores (hand chips + scoring dice) x mult, items fire left to right. */
var HANDS=[
  {id:'high',name:'High Die',chips:5,mult:1,lc:10,lm:1},{id:'pair',name:'Pair',chips:10,mult:2,lc:15,lm:1},{id:'two',name:'Two Pair',chips:20,mult:2,lc:20,lm:1},
  {id:'three',name:'Three of a Kind',chips:30,mult:3,lc:20,lm:2},{id:'sstr',name:'Small Straight',chips:30,mult:4,lc:25,lm:2},{id:'full',name:'Full House',chips:40,mult:4,lc:25,lm:2},
  {id:'lstr',name:'Large Straight',chips:40,mult:5,lc:30,lm:3},{id:'four',name:'Four of a Kind',chips:60,mult:7,lc:30,lm:3},{id:'five',name:'Five of a Kind',chips:100,mult:12,lc:40,lm:4}];
var DTYPES={bone:{name:'Bone die',txt:'A plain die',price:0},venom:{name:'Venom die',txt:'Scored: poison the enemy by its value',price:35},life:{name:'Life die',txt:'Scored: heal by its value',price:35},
  gilt:{name:'Gilded die',txt:'Scored: gain gold equal to its value',price:30},iron:{name:'Iron die',txt:'Scored: block twice its value',price:35},
  ember:{name:'Ember die',txt:'Scored: +3 Mult',price:45},storm:{name:'Storm die',txt:'Scored on 5 or 6: stun the enemy',price:50}};
var ITEMS={
  abacus:{r:1,name:'Bone Abacus',txt:'+1 Mult for every scoring die'},
  patience:{r:1,name:'Hourglass',txt:'+3 Mult for every unused reroll'},
  even:{r:1,name:'Twin Moons',txt:'+12 Chips for every even scoring die'},
  odd:{r:1,name:'Crooked Moon',txt:'+12 Chips for every odd scoring die'},
  mirror:{r:1,name:'Mirror Shard',txt:'Pair or Two Pair: +6 Mult'},
  candle:{r:1,name:'Lonely Candle',txt:'High Die: x4 Mult'},
  idol:{r:1,name:'Six-Eyed Idol',txt:'+20 Chips for every scored 6'},
  fang:{r:1,name:'Serpent Fang',txt:'+5 Mult for every Venom die scored'},
  purse:{r:1,name:'Coin Purse',txt:'Gain 3 gold every attack'},
  tooth:{r:1,name:'Gold Tooth',txt:'+1 Mult for every 8 gold you hold'},
  triplet:{r:2,name:'Triplet Crown',txt:'Three of a Kind or better set: x2 Mult'},
  ladder:{r:2,name:'Rope Ladder',txt:'Any Straight: x3 Mult'},
  maul:{r:2,name:'Thunder Maul',txt:'Four or Five of a Kind stuns the enemy'},
  knuckle:{r:2,name:'Lucky Knuckle',txt:'+1 reroll every turn'},
  leech:{r:2,name:'Leech Jar',txt:'Heal 3% of damage dealt, up to 12'},
  coffin:{r:2,name:'Spiked Coffin',txt:'Iron dice block x2 and hit back x5 what you block'},
  lantern:{r:2,name:'Full Moon Lantern',txt:'Full House: x4 Mult'},
  ember:{r:2,name:'Ember Heart',txt:'+4 Mult for every die NOT in the hand'},
  crown:{r:3,name:'Crown of Bones',txt:'x2 Mult'},
  echo:{r:3,name:'Echo Bell',txt:'Scoring dice count twice'},

// every hand the five dice make, with the indices of the scoring dice
function handsOf(v){var cnt={},out=[];v.forEach(function(x,i){(cnt[x]=cnt[x]||[]).push(i);});
  var groups=Object.keys(cnt).map(function(k){return {v:+k,idx:cnt[k]};}).sort(function(a,b){return b.idx.length-a.idx.length||b.v-a.v;});
  var hi=v.indexOf(Math.max.apply(null,v));out.push({h:'high',idx:[hi]});
  groups.forEach(function(g){if(g.idx.length>=2)out.push({h:'pair',idx:g.idx.slice(0,2)});if(g.idx.length>=3)out.push({h:'three',idx:g.idx.slice(0,3)});if(g.idx.length>=4)out.push({h:'four',idx:g.idx.slice(0,4)});if(g.idx.length>=5)out.push({h:'five',idx:g.idx.slice(0,5)});});

  if(groups.length===2&&groups[0].idx.length===3)out.push({h:'full',idx:[0,1,2,3,4]});

  var l=run(5);if(l)out.push({h:'lstr',idx:l});var s4=run(4);if(s4)out.push({h:'sstr',idx:s4});
  return out;}

function ids(items){var o=[];items.forEach(function(it){if(!it)return;if(it.fuse)o.push.apply(o,it.fuse);else o.push(it.id);});return o;}
// full scoring with an ordered event list for the cascade; st = {rerollsLeft, gold, hp, max, atk (attacks this fight), levels}
function score(dice,cand,items,st){var hv=handVal(cand.h,(st.levels||{})[cand.h]),ev=[],chips=hv.chips,mult=hv.mult,fx={poison:0,heal:0,gold:0,block:0,stun:false,hpLoss:0,thorns:0};
  var all=ids(items),has=function(id){return all.indexOf(id)>=0;},reps=has('echo')?2:1;

    if(d.t==='life'){fx.heal+=d.v;ev.push({k:'fx',i:i,txt:'+'+d.v+' heal'});}
    if(d.t==='gilt'){var gg=d.v*(has('midas')?2:1);fx.gold+=gg;ev.push({k:'fx',i:i,txt:'+'+gg+' gold'});}
    if(d.t==='iron'){var bb=d.v*2*(has('coffin')?2:1);fx.block+=bb;ev.push({k:'fx',i:i,txt:'+'+bb+' block'});}
    if(d.t==='ember'){mult+=3;ev.push({k:'fx',i:i,txt:'+3 Mult',mult:mult});}
    if(d.t==='storm'&&d.v>=5){fx.stun=true;ev.push({k:'fx',i:i,txt:'Stun!'});}}});
  var n=cand.idx.length,sc=cand.idx.map(function(i){return dice[i];}),out=5-n;
  items.forEach(function(it,slot){if(!it)return;(it.fuse||[it.id]).forEach(function(id){var note=null;
    if(id==='abacus'){mult+=n;note='+'+n+' Mult';}
    else if(id==='patience'&&st.rerollsLeft>0){mult+=3*st.rerollsLeft;note='+'+(3*st.rerollsLeft)+' Mult';}
    else if(id==='even'){var e=sc.filter(function(d){return d.v%2===0;}).length*reps;if(e){chips+=12*e;note='+'+(12*e)+' Chips';}}
    else if(id==='odd'){var o=sc.filter(function(d){return d.v%2===1;}).length*reps;if(o){chips+=12*o;note='+'+(12*o)+' Chips';}}
    else if(id==='mirror'&&(cand.h==='pair'||cand.h==='two')){mult+=6;note='+6 Mult';}
    else if(id==='candle'&&cand.h==='high'){mult*=4;note='x4 Mult';}
    else if(id==='idol'){var s6=sc.filter(function(d){return d.v===6;}).length*reps;if(s6){chips+=20*s6;note='+'+(20*s6)+' Chips';}}

    else if(id==='lantern'&&cand.h==='full'){mult*=4;note='x4 Mult';}
    else if(id==='ember'&&out>0){mult+=4*out;note='+'+(4*out)+' Mult';}
    else if(id==='coffin'&&fx.block){fx.thorns=5;note='Thorns';}
    else if(id==='crown'){mult*=2;note='x2 Mult';}
    else if(id==='skull'){var x=1+0.5*(st.atk||0);if(x>1){mult*=x;note='x'+x+' Mult';}}

    else if(id==='midas'){var gd=sc.filter(function(d){return d.t==='gilt';}).length*reps;if(gd){mult+=2*gd;note='+'+(2*gd)+' Mult';}}

function enemyFor(id,act,row){var m=MON[id],k=1+ACTS[act].scale*row;return {id:id,name:m.name,hp:Math.round(m.hp*k/10)*10,boss:!!m.boss,elite:!!m.elite,cycle:m.cycle.map(function(c){return {t:c[0],v:c[0]==='curse'?0:Math.round(c[1]*(c[0]==='armor'||c[0]==='heal'?k:Math.sqrt(k))),n:c[2]||1};})};}
/* map: 6 rows of choices, then the boss */
function makeMap(act,rng){var rows=[],types;
  for(var r=0;r<6;r++){var n=r===0?3:2+((rng()*3)|0),row=[];
    for(var i=0;i<n;i++){var t='fight';
      if(r===0)t='fight';else if(r===2)t=['event','shop','fight'][i%3];else if(r===3)t=rng()<.5?'elite':'fight';else if(r===4)t=['rest','crucible','event','shop'][(i+((rng()*4)|0))%4];else if(r===5)t=rng()<.4?'rest':(rng()<.5?'shop':'fight');else t=rng()<.25?'event':'fight';
      row.push({t:t,x:(i+0.5)/n});}
    if(r===3&&!row.some(function(o){return o.t==='elite';}))row[(rng()*row.length)|0].t='elite';
    rows.push(row);}
  rows.push([{t:'boss',x:.5}]);
  // links: every node links to the 1-2 nearest nodes of the next row, every next node gets at least one link

  return rows;}
