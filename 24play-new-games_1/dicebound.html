<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}</style></head><body><title>Dicebound</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#f3e6cc; --bg-2:#e2cfa8; --wood:#7a4b2a; --wood-d:#4e2d17; --panel:#fff8ea; --panel-2:#f6ead0; --line:#c9a979; --text:#3b2615; --muted:#80664d;
  --red:#d94f3a; --blue:#3f78c9; --green:#4fae4a; --green-d:#2f7a2c; --gold:#f1b72f; --purple:#7d4bc2; --shade:rgba(40,22,8,.6);
  --title:"Cinzel",Georgia,serif; --font:"Fredoka",ui-rounded,"Trebuchet MS",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:radial-gradient(130% 70% at 50% 0%,#fbf2df,var(--bg) 50%,var(--bg-2));background-color:var(--bg);color:var(--text);font-family:var(--font);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit;padding:0}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:440px;margin:0 auto;padding-block:6px 14px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:7px}
.btn{border-radius:14px;font-weight:700;font-size:19px;padding:11px 12px;color:#fff;border:2px solid rgba(0,0,0,.22);box-shadow:inset 0 -4px 0 rgba(0,0,0,.2),0 3px 0 rgba(60,30,10,.35)}
.btn.go{background:var(--green)}.btn.red{background:var(--red)}.btn.blue{background:var(--blue)}.btn.gold{background:var(--gold);color:#4a2c05}.btn.soft{background:#e9dbbd;color:var(--text)}
.btn[disabled]{filter:grayscale(.85);opacity:.5;cursor:default}
/* route */
.route{display:flex;align-items:center;justify-content:center;gap:3px}
.node{width:30px;height:30px;border-radius:50%;background:#e6d4b0;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--muted)}
.node.done{background:#cfe6c4;border-color:var(--green);color:var(--green-d)}
.node.cur{background:var(--gold);border-color:#a36d00;color:#4a2c05;transform:scale(1.12)}
.node.boss{width:36px;height:36px;background:#e2c9e9;border-color:var(--purple);color:var(--purple)}
.node.boss.cur{background:var(--purple);color:#fff}
.node.rest{font-size:9px}
.link{width:10px;height:3px;background:var(--line);border-radius:2px}
/* stage */
.stage{position:relative;border-radius:16px;overflow:hidden;border:3px solid var(--wood);box-shadow:0 4px 0 var(--wood-d)}
.stage canvas{display:block;width:100%;height:auto;max-width:100%}
.bar{position:absolute;top:8px;width:42%;display:flex;flex-direction:column;gap:2px}
.bar.l{left:8px}.bar.r{right:8px;align-items:flex-end}
.bar .nm{font-weight:700;font-size:13px;color:#3b2615;text-shadow:0 1px 0 #fff8ea}
.hp{position:relative;width:100%;height:18px;border-radius:9px;background:rgba(40,22,8,.55);overflow:hidden;border:2px solid rgba(40,22,8,.6)}
.hp i{position:absolute;left:0;top:0;bottom:0;border-radius:7px;transition:width .35s}
.hp b{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700;text-shadow:0 1px 1px rgba(0,0,0,.6)}
.hp .ghost{background:rgba(255,255,255,.55)}
.chips{display:flex;gap:4px;min-height:20px}
.chip{display:flex;align-items:center;gap:3px;font-size:12px;font-weight:700;border-radius:8px;padding:1px 6px;color:#fff}
.chip.blk{background:var(--blue)}.chip.brn{background:#e9772a}
.intent{position:absolute;left:31%;top:64px;max-width:37%;background:#fff8ea;border:3px solid var(--red);border-radius:14px;padding:5px 9px;font-size:14px;font-weight:600;line-height:1.15;box-shadow:0 3px 0 rgba(60,30,10,.25)}
.intent::after{content:"";position:absolute;right:-12px;top:50%;margin-top:-8px;border:8px solid transparent;border-left-color:var(--red);border-right:0}
.intent.guard{border-color:var(--blue)}.intent.guard::after{border-left-color:var(--blue)}
.intent.prep{border-color:#e9772a}.intent.prep::after{border-left-color:#e9772a}
.intent small{display:block;font-size:11px;color:var(--muted);font-weight:500}
.intent b{color:var(--red);font-size:17px}
.intent.guard b{color:var(--blue)}
.banner{position:absolute;left:50%;top:56%;transform:translate(-50%,-50%) scale(.7);font-family:var(--title);font-weight:900;font-size:28px;color:#fff;text-shadow:0 3px 0 #5a2a10,0 0 12px rgba(0,0,0,.4);opacity:0;transition:.18s;white-space:nowrap;pointer-events:none}
.banner.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
/* coach */
.coach{display:flex;align-items:center;gap:8px;background:#fff3c9;border:2px solid var(--gold);border-radius:12px;padding:6px 10px;font-size:15px;line-height:1.25;min-height:44px}
.coach b{color:var(--red)}
.coach .step{flex:none;width:26px;height:26px;border-radius:50%;background:var(--gold);color:#4a2c05;display:grid;place-items:center;font-weight:700;font-size:14px}
/* dice */
.tray{display:flex;gap:10px;justify-content:center;min-height:68px;align-items:center;background:var(--panel-2);border:2px dashed var(--line);border-radius:14px;padding:6px}
.tray .empty{font-size:14px;color:var(--muted)}
.die{width:58px;height:58px;border-radius:14px;background:#fffdf6;border:3px solid #a8865a;box-shadow:0 4px 0 #8e6f44;position:relative;touch-action:none;cursor:grab;flex:none}
.die.sel{transform:translateY(-6px);border-color:var(--gold);box-shadow:0 4px 0 #a36d00,0 0 0 4px rgba(241,183,47,.5)}
.die.roll{animation:roll .45s ease-out}
@keyframes roll{0%{transform:rotate(-200deg) scale(.4);opacity:0}70%{transform:rotate(15deg) scale(1.08);opacity:1}100%{transform:none}}
.die i{position:absolute;width:11px;height:11px;border-radius:50%;background:#3b2615}
.ghost{position:fixed;z-index:40;pointer-events:none;transform:translate(-50%,-50%) scale(1.1);filter:drop-shadow(0 8px 8px rgba(0,0,0,.35))}
/* cards */
.cards{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.card{position:relative;background:var(--panel);border:3px solid var(--line);border-radius:14px;padding:6px 7px 6px 8px;display:flex;gap:7px;align-items:center;min-height:78px;text-align:left;transition:transform .12s,opacity .15s,border-color .15s}
.card .info{flex:1;min-width:0}
.card .nm{font-weight:700;font-size:14px;line-height:1.1;display:flex;align-items:center;gap:4px}
.card .nm svg{width:20px;height:20px;flex:none}
.card .tx{font-size:12.5px;line-height:1.2;color:var(--muted);margin-top:2px}
.card .tx em{font-style:normal;font-weight:700;color:var(--text)}
.slot{flex:none;width:50px;height:50px;border-radius:11px;border:3px dashed #b99d72;display:grid;place-items:center;font-size:11px;font-weight:700;color:#8a6d47;text-align:center;line-height:1.05;background:#fbf3e2;position:relative}
.slots{display:flex;gap:3px;flex:none}
.slots .slot{width:40px;height:40px}
.slot .die{width:40px;height:40px;border-radius:9px;border-width:2px;box-shadow:none;cursor:pointer}
.slot .die i{width:8px;height:8px}
.card .uses{position:absolute;top:-8px;right:6px;background:var(--purple);color:#fff;font-size:11px;font-weight:700;border-radius:8px;padding:0 6px}
.card.ok{border-color:var(--green);box-shadow:0 0 0 3px rgba(79,174,74,.35);transform:scale(1.02)}
.card.ok .slot{border-color:var(--green);background:#e6f5df;color:var(--green-d)}
.card.no{opacity:.45}
.card.used{opacity:.45}
.card.used .slot{border-style:solid}
.card.hot{border-color:var(--gold);box-shadow:0 0 0 4px rgba(241,183,47,.55)}
.card.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.card.pop{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.07);background:#fff1b8}}
.end{display:grid;grid-template-columns:1fr;gap:6px}
#endBtn{font-size:21px;padding:12px}
#endBtn.ready{animation:ready .8s infinite alternate}
@keyframes ready{to{transform:scale(1.03);filter:brightness(1.1)}}
/* pointer */
#hand{position:fixed;z-index:35;width:34px;height:34px;border-radius:50%;border:4px solid #fff;background:rgba(241,183,47,.85);box-shadow:0 0 0 4px rgba(241,183,47,.45),0 4px 10px rgba(0,0,0,.3);pointer-events:none;display:none;transform:translate(-50%,-50%)}
/* overlays */
#toast{position:fixed;left:50%;top:14%;transform:translate(-50%,-8px);background:var(--wood-d);color:#fff;border-radius:12px;padding:7px 14px;font-weight:600;opacity:0;transition:.2s;pointer-events:none;z-index:45;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.ov{position:fixed;inset:0;background:var(--shade);display:grid;place-items:center;padding:14px;z-index:30}
.ov[hidden]{display:none}
.panel{width:100%;max-width:390px;max-height:94vh;overflow:auto;background:var(--panel);border:3px solid var(--wood);border-radius:20px;padding:16px;box-shadow:0 8px 0 var(--wood-d);text-align:center}
.panel h2{font-family:var(--title);font-weight:900;margin:0 0 6px;font-size:26px;line-height:1.1;color:var(--wood-d)}
.panel p{margin:0 0 10px;font-size:15px;line-height:1.35;color:var(--muted)}
.how{display:grid;gap:8px;text-align:left;margin:6px 0 12px}
.how div{display:flex;gap:10px;align-items:center;background:var(--panel-2);border:2px solid var(--line);border-radius:12px;padding:7px 9px;font-size:14.5px;line-height:1.3}
.how .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--gold);color:#4a2c05;display:grid;place-items:center;font-weight:700}
.how b{color:var(--text)}
.pick{display:grid;gap:8px;margin:8px 0}
.pick .card{cursor:pointer}
.bonus{background:#e6f5df;border:2px solid var(--green);border-radius:12px;padding:6px 10px;font-weight:600;color:var(--green-d);margin-bottom:8px}
.btns{display:grid;gap:8px;margin-top:8px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<section id="game" class="wrap">
  <div class="route" id="route"></div>
  <div class="stage" id="stage"><canvas id="c" width="480" height="250"></canvas>
    <div class="bar l"><span class="nm">You</span><div class="hp"><i id="hHp" style="background:var(--green)"></i><b id="hHpT"></b></div><div class="chips" id="hChips"></div></div>
    <div class="bar r"><span class="nm" id="eName">Enemy</span><div class="hp"><i id="eHp" style="background:var(--red)"></i><i class="ghost" id="eGhost"></i><b id="eHpT"></b></div><div class="chips" id="eChips"></div></div>
    <div class="intent" id="intent"></div>
    <div class="banner" id="banner"></div>
  </div>
  <div class="coach" id="coach"></div>
  <div class="tray" id="tray"></div>
  <div class="cards" id="cards"></div>
  <div class="end"><button class="btn red" id="endBtn">End Turn</button></div>
</section>
<div id="hand"></div>
<div id="toast" role="status"></div>
<div class="ov" id="ov" hidden><div class="panel" id="panel"></div></div>

<script>
/* Dicebound v2 rules: roll dice, drop each die on a card, the die value powers the card; then the enemy does what its bubble says. */
var CARDS={
  sword:{name:'Sword',req:'any',uses:1,txt:'Deal # damage',fx:function(v){return [{k:'dmg',v:v}];}},
  shield:{name:'Shield',req:'any',uses:1,txt:'Block # damage',fx:function(v){return [{k:'block',v:v}];}},
  coin:{name:'Lucky Coin',req:'any',uses:1,txt:'Roll this die again',fx:function(v){return [{k:'reroll'}];}},
  axe:{name:'Big Axe',req:'5+',uses:1,txt:'Deal # x2 damage',fx:function(v){return [{k:'dmg',v:v*2}];}},
  dagger:{name:'Dagger',req:'1-3',uses:2,txt:'Deal # +2 damage',fx:function(v){return [{k:'dmg',v:v+2}];}},
  twin:{name:'Twin Strike',req:'pair',uses:1,txt:'Two equal dice: deal # x4',fx:function(v){return [{k:'dmg',v:v*4}];}},
  fire:{name:'Fire Wand',req:'even',uses:1,txt:'Deal #, burn 2 for 3 turns',fx:function(v){return [{k:'dmg',v:v},{k:'burn',v:2}];}},
  spike:{name:'Spiked Shield',req:'any',uses:1,txt:'Block # and deal 2',fx:function(v){return [{k:'block',v:v},{k:'dmg',v:2}];}},
  herb:{name:'Healing Herb',req:'odd',uses:1,txt:'Heal #',fx:function(v){return [{k:'heal',v:v}];}},
  hammer:{name:'Hammer',req:'1-5',uses:2,txt:'Add 1 to the die',fx:function(v){return [{k:'ret',vals:[v+1]}];}},
  split:{name:'Splitter',req:'4+',uses:1,txt:'Split into two dice',fx:function(v){return [{k:'ret',vals:[Math.floor(v/2),Math.ceil(v/2)]}];}}
};
var REQTXT={any:'ANY','5+':'5-6','1-3':'1-3',pair:'PAIR',even:'EVEN',odd:'ODD','1-5':'1-5','4+':'4-6'};
function fits(req,v){return req==='any'||req==='pair'||(req==='5+'&&v>=5)||(req==='1-3'&&v<=3)||(req==='even'&&v%2===0)||(req==='odd'&&v%2===1)||(req==='1-5'&&v<=5)||(req==='4+'&&v>=4);}
function why(req){return {'5+':'needs a 5 or 6','1-3':'needs 1, 2 or 3',even:'needs an even number',odd:'needs an odd number','1-5':'cannot take a 6','4+':'needs 4, 5 or 6',pair:'needs two equal dice'}[req]||'';}
var ENEMIES=[
  {id:'rat',name:'Cellar Rat',hp:10,cycle:[{t:'atk',v:3}]},
  {id:'goblin',name:'Goblin',hp:18,cycle:[{t:'atk',v:6}]},
  {id:'skeleton',name:'Skeleton',hp:23,cycle:[{t:'atk',v:4},{t:'atk',v:4},{t:'atk',v:11}]},
  {id:'ogre',name:'Ogre',hp:31,cycle:[{t:'prep',v:17},{t:'atk',v:17}]},
  {id:'knight',name:'Black Knight',hp:34,cycle:[{t:'guard',v:7},{t:'atk',v:10}]},
  {id:'dragon',name:'Bone Dragon',hp:60,cycle:[{t:'atk',v:7},{t:'guard',v:8},{t:'atk',v:18}],boss:1}
];
var REWARD_POOL=['axe','dagger','twin','fire','spike','herb','hammer','split'];
if(typeof module!=='undefined')module.exports={CARDS:CARDS,REQTXT:REQTXT,fits:fits,why:why,ENEMIES:ENEMIES,REWARD_POOL:REWARD_POOL};

</script>
<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id);};
var SPEED=1,sleep=function(ms){return new Promise(function(r){setTimeout(r,ms*SPEED);});};
var ICON={
  sword:'<svg viewBox="0 0 40 40"><path d="M33 4 L36 7 L19 26 L14 21 Z" fill="#e9eef4" stroke="#5b6573" stroke-width="2"/><path d="M10 19 L21 30" stroke="#c18a2a" stroke-width="5" stroke-linecap="round"/><path d="M14 26 L7 33" stroke="#7a4a1e" stroke-width="5" stroke-linecap="round"/></svg>',
  shield:'<svg viewBox="0 0 40 40"><path d="M20 4 L34 9 V19 C34 28 27 34 20 37 C13 34 6 28 6 19 V9 Z" fill="#4f86d6" stroke="#23457e" stroke-width="2.5"/><path d="M20 8 V33 M10 17 H30" stroke="#d6e5f8" stroke-width="3"/></svg>',
  coin:'<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="15" fill="#f1b72f" stroke="#a36d00" stroke-width="2.5"/><path d="M20 12 L22 18 L28 18 L23 22 L25 28 L20 24 L15 28 L17 22 L12 18 L18 18 Z" fill="#fff6c8"/></svg>',
  axe:'<svg viewBox="0 0 40 40"><path d="M12 36 L28 6" stroke="#7a4a1e" stroke-width="4" stroke-linecap="round"/><path d="M22 8 C30 4 37 9 36 18 C30 16 26 17 22 21 Z" fill="#c9d2dc" stroke="#4d5763" stroke-width="2"/></svg>',
  dagger:'<svg viewBox="0 0 40 40"><path d="M30 6 L33 9 L21 22 L18 19 Z" fill="#e9eef4" stroke="#5b6573" stroke-width="2"/><path d="M15 17 L23 25" stroke="#c18a2a" stroke-width="4" stroke-linecap="round"/><path d="M18 23 L11 30" stroke="#7a4a1e" stroke-width="4" stroke-linecap="round"/></svg>',
  twin:'<svg viewBox="0 0 40 40"><path d="M32 5 L35 8 L19 24 L16 21 Z" fill="#e9eef4" stroke="#5b6573" stroke-width="1.6"/><path d="M8 5 L5 8 L21 24 L24 21 Z" fill="#e9eef4" stroke="#5b6573" stroke-width="1.6"/><path d="M13 21 L20 28 M27 21 L20 28" stroke="#c18a2a" stroke-width="4" stroke-linecap="round"/></svg>',
  fire:'<svg viewBox="0 0 40 40"><path d="M20 3 C27 10 30 15 26 21 C30 19 31 25 27 29 L21 35 L15 30 C10 25 12 18 16 15 C16 19 18 20 19 18 C17 12 18 7 20 3Z" fill="#ff8a2a" stroke="#b33a10" stroke-width="2"/></svg>',
  spike:'<svg viewBox="0 0 40 40"><path d="M20 6 L32 10 V19 C32 27 26 32 20 35 C14 32 8 27 8 19 V10 Z" fill="#8f99a6" stroke="#3f4752" stroke-width="2.5"/><path d="M8 14 L2 12 M32 14 L38 12 M20 6 L20 1 M10 26 L4 29 M30 26 L36 29" stroke="#3f4752" stroke-width="2.5" stroke-linecap="round"/></svg>',
  herb:'<svg viewBox="0 0 40 40"><path d="M20 36 C20 26 20 18 20 10" stroke="#2f7a2c" stroke-width="3"/><path d="M20 20 C10 20 7 12 8 8 C14 8 20 12 20 20Z M20 16 C28 16 32 9 31 5 C24 5 20 10 20 16Z" fill="#4fae4a" stroke="#2f7a2c" stroke-width="2"/></svg>',
  hammer:'<svg viewBox="0 0 40 40"><path d="M14 36 L24 16" stroke="#7a4a1e" stroke-width="4" stroke-linecap="round"/><rect x="16" y="6" width="20" height="12" rx="2" fill="#8f99a6" stroke="#3f4752" stroke-width="2" transform="rotate(28 26 12)"/></svg>',
  split:'<svg viewBox="0 0 40 40"><rect x="4" y="12" width="14" height="14" rx="3" fill="#fffdf6" stroke="#8e6f44" stroke-width="2"/><rect x="22" y="12" width="14" height="14" rx="3" fill="#fffdf6" stroke="#8e6f44" stroke-width="2"/><path d="M20 4 V36" stroke="#d94f3a" stroke-width="3" stroke-dasharray="4 3"/></svg>',
  heal:'<svg viewBox="0 0 40 40"><path d="M20 35 C6 25 4 17 8 11 C12 6 18 8 20 13 C22 8 28 6 32 11 C36 17 34 25 20 35Z" fill="#e2483d" stroke="#8f1f18" stroke-width="2.5"/></svg>'
};
var PIPS={1:[[50,50]],2:[[28,28],[72,72]],3:[[28,28],[50,50],[72,72]],4:[[28,28],[72,28],[28,72],[72,72]],5:[[28,28],[72,28],[50,50],[28,72],[72,72]],6:[[28,24],[72,24],[28,50],[72,50],[28,76],[72,76]]};
function dieEl(v){var d=document.createElement('div');d.className='die';PIPS[v].forEach(function(p){var i=document.createElement('i');i.style.left='calc('+p[0]+'% - 5.5px)';i.style.top='calc('+p[1]+'% - 5.5px)';d.appendChild(i);});return d;}

/* ---------- state ---------- */
var RUN=null,B=null,SNAP=null,diceId=0,sel=null,tut={on:false,step:0},firstRun=true;
try{firstRun=!localStorage.getItem('dicebound2-seen');}catch(e){}
function newRun(){RUN={fight:0,hp:24,max:24,cards:['sword','shield','coin'],nd:3};startFight();}
function startFight(){SNAP=JSON.parse(JSON.stringify(RUN));var d=ENEMIES[RUN.fight];
  B={e:{d:d,hp:d.hp,max:d.hp,block:0,ci:0,bt:0,dead:0},block:0,dice:[],uses:{},pair:{},phase:'player',turn:0};
  tut.on=RUN.fight===0&&firstRun;tut.step=0;hide();renderAll();banner(d.boss?'Boss Fight!':'Fight '+(RUN.fight+1),900);setTimeout(newTurn,500*SPEED);}
function newTurn(){B.turn++;B.uses={};B.pair={};B.block=0;B.phase='player';sel=null;B.dice=[];for(var i=0;i<RUN.nd;i++)B.dice.push({id:++diceId,v:1+((Math.random()*6)|0),fresh:true});
  if(tut.on&&B.turn===1){B.dice[0].v=5;B.dice[1].v=4;B.dice[2].v=1;}
  banner('Your turn',700);renderAll();}
function intentOf(k){var c=B.e.d.cycle;return c[(B.e.ci+(k||0))%c.length];}

/* ---------- render ---------- */
function renderAll(){renderRoute();renderBars();renderTray();renderCards();renderCoach();}
function renderRoute(){var h='';ENEMIES.forEach(function(e,i){if(i)h+='<span class="link"></span>';if(i===3)h+='<span class="node rest">REST</span><span class="link"></span>';
  h+='<span class="node'+(e.boss?' boss':'')+(i<RUN.fight?' done':i===RUN.fight?' cur':'')+'">'+(e.boss?'B':i+1)+'</span>';});$('route').innerHTML=h;}
function renderBars(){$('hHp').style.width=(RUN.hp/RUN.max*100)+'%';$('hHpT').textContent=RUN.hp+' / '+RUN.max;
  $('hChips').innerHTML=B.block?'<span class="chip blk">Block '+B.block+'</span>':'';
